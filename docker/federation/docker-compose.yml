version: "3.7"

x-ui-default: &ui-default
  init: true
  image: dessalines/lemmy-ui:0.19.14
  # assuming lemmy-ui is cloned besides studycycle directory
  # build:
  #   context: ../../../lemmy-ui
  #   dockerfile: dev.dockerfile
  environment:
    - LEMMY_UI_HTTPS=false

x-studycycle-default: &studycycle-default
  build:
    context: ../..
    dockerfile: docker/Dockerfile
  environment:
    - RUST_BACKTRACE=1
    - RUST_LOG="warn,studycycle_server=debug,studycycle_api=debug,studycycle_api_common=debug,studycycle_api_crud=debug,studycycle_apub=debug,studycycle_db_schema=debug,studycycle_db_views=debug,studycycle_routes=debug,studycycle_utils=debug,studycycle_websocket=debug"
  restart: always

x-postgres-default: &postgres-default
  image: pgautoupgrade/pgautoupgrade:18-alpine
  environment:
    - POSTGRES_USER=studycycle
    - POSTGRES_PASSWORD=password
    - POSTGRES_DB=studycycle
  restart: always

services:
  nginx:
    image: nginx:1-alpine
    ports:
      - "8540:8540"
      - "8550:8550"
      - "8560:8560"
      - "8570:8570"
      - "8580:8580"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:Z
    restart: always
    depends_on:
      - pictrs
      - studycycle-alpha-ui
      - studycycle-beta-ui
      - studycycle-gamma-ui
      - studycycle-delta-ui
      - studycycle-epsilon-ui

  pictrs:
    restart: always
    image: asonix/pictrs:0.5.17-pre.9
    user: 991:991
    volumes:
      - ./volumes/pictrs_alpha:/mnt:Z
    environment:
      - PICTRS__SERVER__API_KEY=my-pictrs-key

  studycycle-alpha-ui:
    <<: *ui-default
    environment:
      - LEMMY_UI_LEMMY_INTERNAL_HOST=studycycle-alpha:8541
      - LEMMY_UI_LEMMY_EXTERNAL_HOST=localhost:8541
    depends_on:
      - studycycle-alpha
  studycycle-alpha:
    <<: *studycycle-default
    volumes:
      - ./studycycle_alpha.hjson:/config/config.hjson:Z
    depends_on:
      - postgres_alpha
    ports:
      - "8541:8541"
  postgres_alpha:
    <<: *postgres-default
    volumes:
      - ./volumes/postgres_alpha:/var/lib/postgresql:Z

  studycycle-beta-ui:
    <<: *ui-default
    environment:
      - LEMMY_UI_LEMMY_INTERNAL_HOST=studycycle-beta:8551
      - LEMMY_UI_LEMMY_EXTERNAL_HOST=localhost:8551
    depends_on:
      - studycycle-beta
  studycycle-beta:
    <<: *studycycle-default
    volumes:
      - ./studycycle_beta.hjson:/config/config.hjson:Z
    depends_on:
      - postgres_beta
    ports:
      - "8551:8551"
  postgres_beta:
    <<: *postgres-default
    volumes:
      - ./volumes/postgres_beta:/var/lib/postgresql:Z

  studycycle-gamma-ui:
    <<: *ui-default
    environment:
      - LEMMY_UI_LEMMY_INTERNAL_HOST=studycycle-gamma:8561
      - LEMMY_UI_LEMMY_EXTERNAL_HOST=localhost:8561
    depends_on:
      - studycycle-gamma
  studycycle-gamma:
    <<: *studycycle-default
    volumes:
      - ./studycycle_gamma.hjson:/config/config.hjson:Z
    depends_on:
      - postgres_gamma
    ports:
      - "8561:8561"
  postgres_gamma:
    <<: *postgres-default
    volumes:
      - ./volumes/postgres_gamma:/var/lib/postgresql:Z

  # An instance with only an allowlist for beta
  studycycle-delta-ui:
    <<: *ui-default
    environment:
      - LEMMY_UI_LEMMY_INTERNAL_HOST=studycycle-delta:8571
      - LEMMY_UI_LEMMY_EXTERNAL_HOST=localhost:8571
    depends_on:
      - studycycle-delta
  studycycle-delta:
    <<: *studycycle-default
    volumes:
      - ./studycycle_delta.hjson:/config/config.hjson:Z
    depends_on:
      - postgres_delta
    ports:
      - "8571:8571"
  postgres_delta:
    <<: *postgres-default
    volumes:
      - ./volumes/postgres_delta:/var/lib/postgresql:Z

  # An instance who has a blocklist, with studycycle-alpha blocked
  studycycle-epsilon-ui:
    <<: *ui-default
    environment:
      - LEMMY_UI_LEMMY_INTERNAL_HOST=studycycle-epsilon:8581
      - LEMMY_UI_LEMMY_EXTERNAL_HOST=localhost:8581
    depends_on:
      - studycycle-epsilon
  studycycle-epsilon:
    <<: *studycycle-default
    volumes:
      - ./studycycle_epsilon.hjson:/config/config.hjson:Z
    depends_on:
      - postgres_epsilon
    ports:
      - "8581:8581"
  postgres_epsilon:
    <<: *postgres-default
    volumes:
      - ./volumes/postgres_epsilon:/var/lib/postgresql:Z
